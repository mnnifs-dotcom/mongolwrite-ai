[project]
name = "mongolwrite-api"
version = "0.1.0"
description = "MongolWrite AI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "orjson>=3.10",
  "spylls>=0.1.7",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "httpx>=0.28.1",
  "google-auth>=2.35",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
only-include = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/assets/fonts/cmdashitseden.ttf" = "app/assets/fonts/cmdashitseden.ttf"
"app/assets/fonts/MongolianScript.ttf" = "app/assets/fonts/MongolianScript.ttf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
