services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mongolwrite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mongolwrite}
      POSTGRES_DB: ${POSTGRES_DB:-mongolwrite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mongolwrite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mongolwrite} -d ${POSTGRES_DB:-mongolwrite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongolwrite_pg:
