app = "mongolwrite-ai"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  # Free shared-1x (1 CPU): keep concurrency low so each check finishes fast
  # instead of 8 jobs thrashing the same core (client then times out).
  CHECK_CONCURRENCY = "2"
  CHECK_QUEUE_WAIT_SECONDS = "25"
  # No Redis — memory L1 only (zero extra cost). Set REDIS_URL only if you accept paid cache.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "mongolwrite_data"
  destination = "/app/data/persist"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
