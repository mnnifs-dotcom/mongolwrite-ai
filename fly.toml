app = "mongolwrite-ai"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "mongolwrite_data"
  destination = "/app/data/persist"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
