app = "mongolwrite-ai"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  # performance-1x: dedicated CPU — raise concurrency safely.
  CHECK_CONCURRENCY = "4"
  CHECK_QUEUE_WAIT_SECONDS = "20"
  # REDIS_URL set via `fly secrets` when Upstash Redis is attached.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "mongolwrite_data"
  destination = "/app/data/persist"

[[vm]]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 1
